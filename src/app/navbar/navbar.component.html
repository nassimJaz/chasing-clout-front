<nav>
  <div>
    <a class="brand" routerLink="">Chasing Clout</a>
    <mat-nav-list>
      @for (link of links; track link) {
      <a mat-list-item routerLink="{{ link.href }}" routerLinkActive="active">
        <span>{{ link.name }}</span>
      </a>
      }
    </mat-nav-list>
    @if (game.profile$ | async; as profile) {
    <div class="free">
      @if (countdown(profile.nextFreeBoosterAt); as left) {
      <button class="btn btn-outline-light" disabled>Booster gratuit dans {{ left }}</button>
      } @else {
      <button class="btn btn-light" [disabled]="claiming" (click)="claimFree()">Booster gratuit</button>
      }
      @if (freeError) {
      <span class="toast" role="alert">{{ freeError }}</span>
      }
    </div>
    <span class="balance">{{ balance ?? profile.memeBalance }} memes</span>
    }
    <select
      class="form-select player"
      aria-label="Joueur"
      [ngModel]="player.playerId$ | async"
      (ngModelChange)="switchPlayer($event)"
    >
      @for (p of players; track p.id) {
      <option [ngValue]="p.id">{{ p.name }}</option>
      }
    </select>
  </div>
</nav>
