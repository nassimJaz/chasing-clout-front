<nav>
  <div>
    <a class="brand" routerLink="">Chasing Clout</a>
    <mat-nav-list>
      @for (link of links; track link) {
      <a mat-list-item routerLink="{{ link.href }}" routerLinkActive="active">
        <span>{{ link.name }}</span>
      </a>
      }
    </mat-nav-list>
    @if (game.profile$ | async; as profile) {
    <span class="balance">{{ profile.username }} · {{ profile.memeBalance }} memes</span>
    }
  </div>
</nav>
