server {
    listen 80;
    root /usr/share/nginx/html;

    # the API on the same origin (environment.prod.ts: apiUrl "/api"): no CORS, and the API isn't published
    location /api/ {
        proxy_pass http://api:8080/;
    }

    # card images on the same origin, so the 3D scenes can use them as WebGL textures (proxy.conf.json in dev)
    location /memes/ {
        proxy_pass http://api:8080;
    }

    # Angular routes (/boutique, /collection...) are all index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
